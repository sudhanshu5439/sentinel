# Local deployment of the Sentinel demo apps (kind). Later this moves to the sentinel-gitops repo
# with base + overlays per environment, managed by Argo CD.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentinel

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - risk-engine.yaml
  - order-api.yaml
  - notifier.yaml

# The DB password is generated by `make secrets` into a git-ignored file: never committed.
secretGenerator:
  - name: postgres-credentials
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: sentinel
    includeSelectors: false
