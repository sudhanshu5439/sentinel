[project]
name = "notifier"
version = "0.1.0"
description = "Sentinel notifier: consumes order events from a Redis Stream and sends notifications"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.54.0",
  "redis>=5.0",
  "prometheus-client>=0.20",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "fakeredis>=2.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifier"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
