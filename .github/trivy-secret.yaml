# Trivy secret-scanner exceptions, kept as narrow as possible: one path pattern per known false
# positive, with the reason. Everything else in every image is still scanned for secrets.
allow-rules:
  - id: anthropic-sdk-generated-types
    description: >-
      Docstrings in the Anthropic SDK's generated type modules (e.g. a masked "{****}" principal
      placeholder) match the GCP service-account rule. Library source, not a credential.
    path: .*/site-packages/anthropic/types/.*\.py
