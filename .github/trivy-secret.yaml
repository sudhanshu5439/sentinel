# Trivy secret-scanner exceptions, kept as narrow as possible: one path pattern per known false
# positive, with the reason. Everything else in every image is still scanned for secrets.
allow-rules:
  - id: anthropic-sdk-docstrings
    description: >-
      Docstrings in the Anthropic SDK's generated modules (a masked "{****}" execution-principal
      placeholder, in types/ and resources/) match the GCP service-account rule. Library
      source, not a credential.
    path: .*/site-packages/anthropic/.*\.py
