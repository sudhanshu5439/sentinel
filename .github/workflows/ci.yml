# Sentinel CI: every pull request and every push to main goes through these gates.
#   1. secrets scan (Gitleaks)   2. SAST (Semgrep)   3. lint + unit tests per service
#   4. Kubernetes manifest validation
# On main, each image then goes through the secure supply chain (build, scan, SBOM, sign, attest).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect app changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.diff.outputs.apps }}
      assistant: ${{ steps.diff.outputs.assistant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Images are rebuilt (and a new canary started) only when application code changed.
          # Manual runs always build. Docs, scripts and workflow edits do not ship a new release.
          if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            { echo "apps=true"; echo "assistant=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The assistant ships on its own: changing it must not start a canary of the apps.
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^aiops/'; then
            echo "assistant=true" >> "$GITHUB_OUTPUT"
          else
            echo "assistant=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^apps/'; then
            echo "apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes under apps/: skipping image build and promotion"
          fi

  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload findings to the GitHub Security tab
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Semgrep scan (fail on ERROR-severity findings)
        run: |
          semgrep scan --config p/default --config p/python --config p/golang \
            --config p/dockerfile --config p/kubernetes \
            --severity ERROR --error \
            --sarif --output semgrep.sarif .
      - name: Show findings as annotations
        if: always() && hashFiles('semgrep.sarif') != ''
        run: |
          python3 - <<'PY'
          import json
          for run in json.load(open("semgrep.sarif"))["runs"]:
              for r in run.get("results", []):
                  loc = r["locations"][0]["physicalLocation"]
                  path, line = loc["artifactLocation"]["uri"], loc["region"]["startLine"]
                  msg = r["message"]["text"].replace("\n", " ")[:300]
                  print(f"::error file={path},line={line},title={r['ruleId']}::{msg}")
          PY
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  test-python:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: order-api, dir: apps/order-api }
          - { service: notifier, dir: apps/notifier }
          - { service: sentinel-assistant, dir: aiops }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  test-go:
    name: Test risk-engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/risk-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/risk-engine/go.mod
          cache: false # no third-party modules to cache
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kustomize + kubeconform
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
      - name: Render and validate
        run: |
          echo "POSTGRES_PASSWORD=ci-placeholder" > deploy/local/secrets.env
          ./kustomize build deploy/local | ./kubeconform -strict -summary

  supply-chain:
    name: Supply chain ${{ matrix.service }}
    needs: [changes, secrets-scan, sast, test-python, test-go, manifests]
    if: needs.changes.outputs.apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: [order-api, risk-engine, notifier]
    uses: ./.github/workflows/supply-chain.yml
    with:
      service: ${{ matrix.service }}
      # Only main produces published, signed images; pull requests build and scan only.
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      id-token: write # OIDC token for keyless signing and attestations
      attestations: write
      security-events: write

  supply-chain-assistant:
    name: Supply chain sentinel-assistant
    needs: [changes, secrets-scan, sast, test-python, manifests]
    if: needs.changes.outputs.assistant == 'true'
    uses: ./.github/workflows/supply-chain.yml
    with:
      service: assistant
      context: aiops
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write

  promote-assistant:
    name: Deploy sentinel-assistant (aiops)
    needs: [supply-chain-assistant]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: gitops-promote
      cancel-in-progress: false
    env:
      OWNER: ${{ github.repository_owner }}
      GITOPS_REPO: ${{ github.repository_owner }}/sentinel-gitops
      SHA: ${{ github.sha }}
      DIGEST: ${{ needs.supply-chain-assistant.outputs.digest }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Check the GitOps token is configured
        id: token
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::warning::GITOPS_TOKEN secret not set; skipping deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      # A platform component with one environment: a direct commit, like the staging promotion.
      - name: Point platform/aiops at the new digest
        if: steps.token.outputs.ok == 'true'
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz -C /usr/local/bin
          cd gitops/platform/aiops
          kustomize edit set image \
            "ghcr.io/${OWNER}/sentinel-assistant=ghcr.io/${OWNER}/sentinel-assistant@${DIGEST}"
          cd ../..
          if git diff --quiet; then echo "already up to date"; exit 0; fi
          git config user.name "sentinel-ci[bot]"
          git config user.email "sentinel-ci@users.noreply.github.com"
          git commit -am "deploy(aiops): sentinel-assistant@${SHA::7}"
          git push origin HEAD:main

  promote:
    name: Promote to staging (+ open prod PR)
    needs: [supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: gitops-promote # promotions never race each other
      cancel-in-progress: false
    env:
      OWNER: ${{ github.repository_owner }}
      GITOPS_REPO: ${{ github.repository_owner }}/sentinel-gitops
      SHA: ${{ github.sha }}
      # Fine-grained token with contents + pull-requests write on sentinel-gitops only.
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - name: Check the GitOps token is configured
        id: token
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::warning::GITOPS_TOKEN secret not set; skipping promotion"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - uses: docker/login-action@v3
        if: steps.token.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the digests built from this commit
        if: steps.token.outputs.ok == 'true'
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz -C /usr/local/bin
          : > digests.txt
          for svc in order-api risk-engine notifier; do
            ref="ghcr.io/${OWNER}/sentinel-${svc}:sha-${SHA}"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            echo "${svc} ${digest}" | tee -a digests.txt
          done

      - name: Promote to staging (direct commit; Argo CD syncs it)
        if: steps.token.outputs.ok == 'true'
        run: |
          cd gitops
          git config user.name "sentinel-ci[bot]"
          git config user.email "sentinel-ci@users.noreply.github.com"
          while read -r svc digest; do
            (cd apps/overlays/staging && kustomize edit set image \
              "ghcr.io/${OWNER}/sentinel-${svc}=ghcr.io/${OWNER}/sentinel-${svc}@${digest}")
          done < ../digests.txt
          if git diff --quiet; then echo "staging already up to date"; exit 0; fi
          git commit -am "promote(staging): sentinel@${SHA::7}"
          git push origin HEAD:main

      - name: Open a pull request to promote the same digests to prod
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          cd gitops
          branch="promote/prod-${SHA::7}"
          git checkout -b "$branch"
          while read -r svc digest; do
            (cd apps/overlays/prod && kustomize edit set image \
              "ghcr.io/${OWNER}/sentinel-${svc}=ghcr.io/${OWNER}/sentinel-${svc}@${digest}")
          done < ../digests.txt
          if git diff --quiet; then echo "prod already up to date"; exit 0; fi
          git commit -am "promote(prod): sentinel@${SHA::7}"
          git push origin "$branch"
          {
            echo "Promotes the images built from sudhanshu5439/sentinel@${SHA} to **prod**."
            echo
            echo "| Service | Digest |"
            echo "| --- | --- |"
            while read -r svc digest; do echo "| ${svc} | \`${digest}\` |"; done < ../digests.txt
            echo
            echo "Already running in staging. Each image is signed by supply-chain.yml and verified by Kyverno at admission."
          } > ../pr-body.md
          gh pr create --repo "$GITOPS_REPO" --base main --head "$branch" \
            --title "promote(prod): sentinel@${SHA::7}" --body-file ../pr-body.md
          # Only the newest promotion matters: close older, still-open prod promotion PRs.
          new=$(gh api "repos/${GITOPS_REPO}/pulls?state=open&per_page=100" \
                  --jq ".[] | select(.head.ref == \"${branch}\") | .number")
          for n in $(gh api "repos/${GITOPS_REPO}/pulls?state=open&per_page=100" \
                       --jq ".[] | select(.head.ref | startswith(\"promote/prod-\")) | select(.head.ref != \"${branch}\") | .number"); do
            gh api "repos/${GITOPS_REPO}/issues/${n}/comments" -f body="Superseded by #${new}." >/dev/null
            gh api -X PATCH "repos/${GITOPS_REPO}/pulls/${n}" -f state=closed >/dev/null
            echo "closed superseded PR #${n}"
          done
