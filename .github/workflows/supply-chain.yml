# Reusable secure supply chain for one service image:
#   build -> vulnerability scan (block on CRITICAL) -> push by digest -> SBOM -> sign -> attest
# Signing is keyless (Sigstore): the certificate identity is THIS workflow file in THIS repo,
# which is exactly what the cluster's admission policy will later check.
name: supply-chain

on:
  workflow_call:
    inputs:
      service:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    outputs:
      digest:
        description: Image digest (sha256:...) of the published image
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sentinel-${{ inputs.service }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ inputs.publish }}

      # Build once and load it locally, so the scan runs BEFORE anything is published.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.service }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Vulnerability scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Vulnerability report (HIGH + CRITICAL) for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif

      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ inputs.service }}

      # Same build inputs + cache = the same image as the one just scanned, now pushed.
      - name: Push
        id: build
        if: inputs.publish
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ inputs.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.service }}

      - name: Generate SBOM (SPDX)
        if: inputs.publish
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@v3
        if: inputs.publish

      - name: Sign image (keyless, Sigstore)
        if: inputs.publish
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Attest SBOM
        if: inputs.publish
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance (SLSA)
        if: inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: inputs.publish
        run: |
          {
            echo "### ${{ inputs.service }}"
            echo "- Image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "- Scanned (Trivy), SBOM attached, signed (cosign keyless), provenance attested"
            echo "- Verify: \`cosign verify ${IMAGE}@${{ steps.build.outputs.digest }} --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
